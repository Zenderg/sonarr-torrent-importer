services:
  media-config:
    image: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    restart: "no"
    environment:
      DEV_PUID: ${DEV_PUID:-1000}
      DEV_PGID: ${DEV_PGID:-1000}
    volumes:
      - integration-media:/media
      - ${INTEGRATION_FIXTURE_HOST_PATH:-./.integration-fixtures}/downloads:/fixture-downloads
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        mkdir -p /media/library /media/incomplete /fixture-downloads
        chown -R "$${DEV_PUID}:$${DEV_PGID}" /media /fixture-downloads
        chmod -R u+rwX,g+rwX /fixture-downloads

  sonarr-config:
    image: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    restart: "no"
    environment:
      DEV_PUID: ${DEV_PUID:-1000}
      DEV_PGID: ${DEV_PGID:-1000}
      SONARR_API_KEY: ${SONARR_API_KEY:?set SONARR_API_KEY in .env}
    volumes:
      - sonarr-config:/config
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        if [ ! -f /config/config.xml ]; then
          printf '%s\n' \
            '<Config>' \
            '  <BindAddress>*</BindAddress>' \
            '  <Port>8989</Port>' \
            '  <SslPort>9898</SslPort>' \
            '  <EnableSsl>False</EnableSsl>' \
            '  <LaunchBrowser>False</LaunchBrowser>' \
            "  <ApiKey>$${SONARR_API_KEY}</ApiKey>" \
            '  <AuthenticationMethod>External</AuthenticationMethod>' \
            '  <AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>' \
            '  <Branch>main</Branch>' \
            '  <LogLevel>info</LogLevel>' \
            '  <UrlBase></UrlBase>' \
            '  <InstanceName>Sonarr local integration</InstanceName>' \
            '  <UpdateMechanism>Docker</UpdateMechanism>' \
            '</Config>' > /config/config.xml
        fi
        chown -R "$${DEV_PUID}:$${DEV_PGID}" /config

  sonarr:
    image: ${SONARR_DEV_IMAGE:-lscr.io/linuxserver/sonarr:4.0.19.2979-ls320@sha256:24acea2956a0ccb11f103877d9f4f8576600fb34bff34820ed749c2256dab89f}
    restart: unless-stopped
    depends_on:
      media-config:
        condition: service_completed_successfully
      sonarr-config:
        condition: service_completed_successfully
    environment:
      PUID: ${DEV_PUID:-1000}
      PGID: ${DEV_PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "127.0.0.1:${SONARR_HOST_PORT:-18989}:8989"
    volumes:
      - sonarr-config:/config
      - integration-media:/media
      - ${INTEGRATION_FIXTURE_HOST_PATH:-./.integration-fixtures}/downloads:/media/downloads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8989/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  qbittorrent-config:
    image: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    restart: "no"
    environment:
      DEV_PUID: ${DEV_PUID:-1000}
      DEV_PGID: ${DEV_PGID:-1000}
    volumes:
      - qbittorrent-config:/config
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        mkdir -p /config/qBittorrent
        if [ ! -f /config/qBittorrent/qBittorrent.conf ]; then
          printf '%s\n' \
            '[BitTorrent]' \
            'Session\DefaultSavePath=/media/downloads/' \
            'Session\Port=6881' \
            'Session\TempPath=/media/incomplete/' \
            '' \
            '[LegalNotice]' \
            'Accepted=true' \
            '' \
            '[Preferences]' \
            'Downloads\SavePath=/media/downloads/' \
            'WebUI\Address=*' \
            'WebUI\HostHeaderValidation=false' \
            'WebUI\Password_PBKDF2="@ByteArray(c29uYXJyLWltcG9ydGVyIQ==:o/OZfiwXxWXt8OYfzl/KqrvtewnNMDqis8rpyl/5nOwZiNpi276D2PkknDaTCNyS8EU+2CEnYstjWm6Xb1MOWw==)"' \
            'WebUI\Port=8080' \
            'WebUI\Username=importer' \
            > /config/qBittorrent/qBittorrent.conf
        fi
        chown -R "$${DEV_PUID}:$${DEV_PGID}" /config

  qbittorrent:
    image: ${QBITTORRENT_DEV_IMAGE:-lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.13-ls469@sha256:b024436f8ca665d16d9a997d26fd27fdf867ee5566ba09f32764e7b2976d3e02}
    restart: unless-stopped
    depends_on:
      media-config:
        condition: service_completed_successfully
      qbittorrent-config:
        condition: service_completed_successfully
    environment:
      PUID: ${DEV_PUID:-1000}
      PGID: ${DEV_PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    ports:
      - "127.0.0.1:${QBITTORRENT_HOST_PORT:-18081}:8080"
    volumes:
      - qbittorrent-config:/config
      - integration-media:/media
      - ${INTEGRATION_FIXTURE_HOST_PATH:-./.integration-fixtures}/downloads:/media/downloads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  fixture-server:
    image: sonarr-torrent-importer-fixture-server:dev
    build:
      context: .
      dockerfile: Dockerfile.fixture
    restart: unless-stopped
    environment:
      QBIT_RENAME_RESPONSE_DELAY: ${QBIT_RENAME_RESPONSE_DELAY:-10s}
      QBIT_ADD_RESPONSE_DELAY: ${QBIT_ADD_RESPONSE_DELAY:-5s}
      QBIT_DELETE_RESPONSE_DELAY: ${QBIT_DELETE_RESPONSE_DELAY:-5s}
    volumes:
      - ${INTEGRATION_FIXTURE_HOST_PATH:-./.integration-fixtures}:/fixtures:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  importer:
    depends_on:
      fixture-server:
        condition: service_started
      sonarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
    environment:
      QBITTORRENT_URL: http://fixture-server:8080/qbittorrent
      PROWLARR_URL: http://fixture-server:8080
      PROWLARR_API_KEY: fixture-secret
      QBITTORRENT_MEDIA_ROOT: /media/downloads
      SONARR_MEDIA_ROOT: /media/downloads
      IMPORTER_MEDIA_ROOT: /media/downloads
      REVISION_POLL_INTERVAL: 1h
      COMMAND_TIMEOUT: ${INTEGRATION_COMMAND_TIMEOUT:-2m}
      WORKFLOW_TIMEOUT: ${INTEGRATION_WORKFLOW_TIMEOUT:-5m}
    volumes:
      - ${INTEGRATION_FIXTURE_HOST_PATH:-./.integration-fixtures}/downloads:/media/downloads
    group_add:
      - ${DEV_PGID:-1000}

volumes:
  sonarr-config:
  qbittorrent-config:
  integration-media:
